name: auto-merge
# Merges two-way-door PRs only. Shadow mode until repo variable AUTO_MERGE_ENABLED is "true".
on:
  schedule:
    - cron: "*/30 * * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: auto-merge
jobs:
  auto-merge:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyyaml
      - env:
          GH_TOKEN: ${{ github.token }}
          ENABLED: ${{ vars.AUTO_MERGE_ENABLED }}
          MERGE_FREEZE: ${{ vars.MERGE_FREEZE }}
        run: python3 tools/auto_merge.py
